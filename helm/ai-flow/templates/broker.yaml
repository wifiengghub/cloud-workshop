{{- if .Values.broker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-flow.fullname" . }}-broker-config
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    {{- .Files.Get "files/mosquitto.simulate.conf" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-flow.fullname" . }}-mqtt-broker
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
spec:
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
  selector:
    app.kubernetes.io/name: {{ include "ai-flow.name" . }}-mqtt-broker
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-flow.fullname" . }}-mqtt-broker
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-flow.name" . }}-mqtt-broker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-flow.name" . }}-mqtt-broker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mosquitto
          image: {{ .Values.broker.image | quote }}
          ports:
            - containerPort: 1883
              name: mqtt
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-flow.fullname" . }}-broker-config
{{- end }}