{{- if .Values.timescaledb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-flow.fullname" . }}-timescaledb
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "ai-flow.name" . }}-timescaledb
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai-flow.fullname" . }}-timescaledb
  labels:
    {{- include "ai-flow.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ai-flow.fullname" . }}-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-flow.name" . }}-timescaledb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-flow.name" . }}-timescaledb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: timescaledb
          image: {{ .Values.timescaledb.image | quote }}
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user | quote }}
                - -d
                - {{ .Values.database.name | quote }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-flow.fullname" . }}-credentials
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ai-flow.fullname" . }}-timescaledb
{{- end }}
